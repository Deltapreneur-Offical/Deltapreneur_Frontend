name: Automated Deploy to Lightsail

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: SSH into Lightsail and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.HOST }}
        username: ${{ secrets.USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          cd ~/projects/CoBrother_Frontend
          git pull origin main
          npm install
          VITE_API_URL=https://backend.cobrother.com npm run build
          sudo systemctl restart nginx
