name: Frontend Tests

on:
  pull_request:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Frontend
        env:
          VITE_API_URL: https://api.deltapreneur.com
          VITE_APP_URL: https://deltapreneur.com
          VITE_REQUIRE_DOMAIN_VERIFICATION_BEFORE_PURCHASE: 'true'
          VITE_REQUIRE_TECHNOLOGY_VERIFICATION_BEFORE_PURCHASE: 'true'
          VITE_TURNSTILE_SITE_KEY: test-site-key
        run: npm run build
