name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main

env:
  DEPLOY_ROOT: ${{ vars.FRONTEND_DEPLOY_PATH || '/home/ubuntu/projects/CoBrother_Frontend' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies & Build
        env:
          VITE_API_URL: https://demo.cobrother.com/api
          VITE_APP_URL: https://demo.cobrother.com
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          grep -q 'padding-left:0' dist/assets/index-*.css

      - name: Create deployment archive
        run: tar -czf frontend-dist.tar.gz -C dist .

      - name: Upload deployment archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: frontend-dist.tar.gz
          target: ${{ env.DEPLOY_ROOT }}/

      - name: Extract build and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            ROOT="${{ env.DEPLOY_ROOT }}"
            mkdir -p "${ROOT}"
            cd "${ROOT}"

            tar -xzf frontend-dist.tar.gz
            rm -f frontend-dist.tar.gz

            test -f index.html
            CSS_FILE="$(basename "$(grep -o '/assets/index-[^\"]*\.css' index.html | head -1 | tr -d '"')")"
            CSS_PATH="${ROOT}/assets/${CSS_FILE}"

            test -f "${CSS_PATH}"
            grep -q 'home-auction-preview-card__metric-value{display:block;padding-left:0' "${CSS_PATH}"

      - name: Restart Nginx Web Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sudo nginx -t
            sudo systemctl restart nginx
