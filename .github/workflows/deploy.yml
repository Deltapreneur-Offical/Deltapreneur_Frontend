# Production frontend is deployed by Vercel Git integration.
# The previous EC2 SSH job is disabled so Deltapreneur main cannot overwrite CoBrother.
name: Frontend production note

on:
  push:
    branches:
      - main

jobs:
  vercel-handles-production:
    runs-on: ubuntu-latest
    steps:
      - name: Skip EC2 deploy
        run: echo "Frontend production is Vercel only. EC2 / CoBrother deploy is disabled."
