<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="./src/assets/Deltapreneur_favicon.png" media="(prefers-color-scheme: dark)" />
  <link rel="icon" type="image/png" href="./src/assets/Deltapreneur_favicon.png" media="(prefers-color-scheme: light)" />
  <script>
    (function () {
      var darkHref = '/Deltapreneur_favicon.png';
      var lightHref = '/Deltapreneur_favicon.png';
      var darkLink = document.querySelector('link[rel="icon"][media*="dark"]');
      var lightLink = document.querySelector('link[rel="icon"][media*="light"]');
      if (darkLink) darkHref = darkLink.getAttribute('href') || darkHref;
      if (lightLink) lightHref = lightLink.getAttribute('href') || lightHref;

      function applyFavicon() {
        var isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.querySelectorAll('link[rel="icon"], link[rel="shortcut icon"]').forEach(function (node) {
          node.remove();
        });
        var link = document.createElement('link');
        link.id = 'dynamic-favicon';
        link.rel = 'icon';
        link.type = 'image/png';
        link.href = isDark ? darkHref : lightHref;
        document.head.appendChild(link);
      }

      applyFavicon();
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyFavicon);
    })();
  </script>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Permissions-Policy" content="unload=*" />
  <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin />
  <link rel="dns-prefetch" href="https://challenges.cloudflare.com" />
  <title>Deltapreneur</title>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
