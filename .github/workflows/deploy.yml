name: Deploy Frontend to EC2

on:
  push:
    branches:
      - main

env:
  DEPLOY_ROOT: /opt/cobrother/frontend/dist

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify deploy secrets
        run: |
          missing=0
          for name in EC2_HOST EC2_USER EC2_SSH_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing GitHub secret: ${name}. Add EC2_HOST, EC2_USER, and EC2_SSH_KEY in repository or organization secrets (same as CoBrother_Backend deploy)."
              missing=1
            fi
          done
          exit "${missing}"
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies & Build
        env:
          VITE_API_URL: https://demo.cobrother.com/api
          VITE_APP_URL: https://demo.cobrother.com
        run: |
          npm ci
          npm run build
          test -f dist/index.html

      - name: Create deployment archive
        run: tar -czf frontend-dist.tar.gz -C dist .

      - name: Upload deployment archive
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: frontend-dist.tar.gz
          target: /tmp

      - name: Extract build and verify
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e

            sudo mkdir -p /opt/cobrother/frontend/dist

            sudo tar -xzf /tmp/frontend-dist.tar.gz \
              -C /opt/cobrother/frontend/dist

            sudo rm -f /tmp/frontend-dist.tar.gz

            test -f /opt/cobrother/frontend/dist/index.html

      - name: Restart Nginx Web Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            sudo nginx -t
            sudo systemctl restart nginx
