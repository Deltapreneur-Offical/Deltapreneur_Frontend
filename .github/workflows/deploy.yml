name: Automated Deploy to Lightsail

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies & Build
        env:
          VITE_API_URL: https://demo.cobrother.com/api
          VITE_APP_URL: https://demo.cobrother.com
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          grep -q 'padding-left:0' dist/assets/index-*.css

      - name: Prepare production dist directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            FRONTEND_ROOT="/home/ubuntu/projects/CoBrother_Frontend"
            DIST_DIR="${FRONTEND_ROOT}/dist"

            rm -rf "${DIST_DIR}"
            mkdir -p "${DIST_DIR}"

            # Older deploys copied build output to the repo root; remove stale files.
            rm -f "${FRONTEND_ROOT}/index.html" "${FRONTEND_ROOT}/robots.txt"
            rm -rf "${FRONTEND_ROOT}/assets"

      - name: Sync production build to Lightsail
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist/*"
          target: "/home/ubuntu/projects/CoBrother_Frontend/dist/"

      - name: Verify deployed CSS bundle
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -euo pipefail
            DIST_DIR="/home/ubuntu/projects/CoBrother_Frontend/dist"
            CSS_FILE="$(basename "$(grep -o '/assets/index-[^\"]*\.css' "${DIST_DIR}/index.html" | head -1 | tr -d '"')")"
            CSS_PATH="${DIST_DIR}/assets/${CSS_FILE}"

            test -f "${CSS_PATH}"
            grep -q 'home-auction-preview-card__metric-value{display:block;padding-left:0' "${CSS_PATH}"

      - name: Restart Nginx Web Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            sudo nginx -t
            sudo systemctl restart nginx
